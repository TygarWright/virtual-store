services:
  - type: cron
    name: virtual-store-reconciliation
    runtime: python
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/run_reconciliation.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: SITE_URL
        sync: false
      - key: CRON_SECRET
        sync: false
